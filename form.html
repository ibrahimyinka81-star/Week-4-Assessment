<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <header>
        <nav>
            <a href="index.html">Home</a> |
            <a href="form.html">Application Form</a>
        </nav>
    </header>
    <main>
        <h1>Altschool Application Form</h1>

        <p>
            Fill in the form below to apply to the Altschool Program, School of Engineering.
        </p>
        <section>
            <h2>Personal Information</h2>

            <form>

                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="First_name" placeholder="Enter your first name" required> <br><br>


                <label for="last_name">Last Name:</label> 
                <input type="text" id="last_name" name="Last_name" placeholder="Enter your last name" required> <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required> <br><br>

                <label for="phone_number">Phone Number:</label>
                <input type="tel" id="phone_number" name="Phone_Number" placeholder="Enter your phone number" required> <br><br>
                 
                <label for="password">Password:</label>
                <input type="password" id="password" name="Password" placeholder="Create a password" required> <br><br>


                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="Confirm_Password" placeholder="Confirm your password" required> <br><br>

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    By clicking Create account, I agree to Terms of Use and acknowledge that I have read the Privacy Policy.
                </label>  <br><br>

                <button type="create account">Create Account</button> <br><br>


            </form>


        </section>

    </main>
